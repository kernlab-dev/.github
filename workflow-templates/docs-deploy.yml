name: docs-deploy

# KernLab 家族标准文档发布调用桩（逻辑单源在 kernlab-dev/.github 的 reusable-docs-deploy）：
# push main（文档相关路径）→ 构建文档站 → artifact(docs-site) → 触发 kernlab-docs 聚合
# → docs.kernlab.dev/<product>/（Cloudflare Pages 自动部署）
#
# 使用前必改（搜索 <产品>）：
#   ① paths 过滤覆盖本产品全部文档源
#   ② product=<产品路径名>
#   ③ project_paths=<全部发布项目 csproj 清单>（★漏一个项目其 API 参考整层缺失）
# 前置 secret：DOCS_SYNC_TOKEN（对 kernlab-dev/kernlab-docs 有 actions:write 的 PAT）
# 站点配置模板：docfx-template/；规则全文：.github-private DOC-PUBLISH.md

on:
  push:
    branches: [main]
    paths:
      - 'src/**/docs/**'
      - 'src/*/COORDINATION.md'
      - 'docs-site/**'
      - 'README.md'
      - 'toc.yml'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: kernlab-dev/.github/.github/workflows/reusable-docs-deploy.yml@main
    with:
      product: <产品路径名>
      project_paths: 'src/<项目A>.csproj src/<项目B>.csproj'
    secrets:
      DOCS_SYNC_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
