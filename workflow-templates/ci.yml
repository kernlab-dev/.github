name: CI

# KernLab 家族标准 CI 调用桩（新建仓从 Actions 模板选用后按需改）：
# 逻辑单源在 kernlab-dev/.github 的 reusable-ci——本文件只声明触发与参数。
# 分支模型：main（发布线）+ dev（集成线）；PR 门禁另配 workflow-templates/policy.yml。
#
# Runner 双形态：
#   ① 默认 GitHub 托管机器（下面现状）：零基础设施，push 即跑；
#   ② 自建独立 CI 机器：runner 建好后把 runners_matrix 换成标签组合并关 setup-dotnet：
#        runners_matrix: '["win-ci","pve-ci"]'
#        use_setup_dotnet: false
#      （自建机预装 SDK——中国网络下 setup-dotnet 基线 runtime 下载随机卡死，禁开）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:   # main/dev 之外的功能分支走手动：gh workflow run ci --ref <branch>

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── docs 快速通道分诊（BRANCHING §6.2）──
  # ★不给本 job 挂任何 if——必须无条件常跑（内部对非 PR 上下文恒成功返回 docs_only=false）。
  #   success() 对 needs DAG 传递求值：triage 一旦 skipped/失败，下游整链（编译/测试/E2E）
  #   被传染跳过＝空壳绿（tier#1417 / traffic#382 判例）。
  #   双条件门（docs/* 来源 + 目标 dev + 纯文档 diff）整体收在消费端条件里。
  triage:
    name: docs 分诊
    uses: kernlab-dev/.github/.github/workflows/reusable-e20-triage.yml@main

  ci:
    needs: triage
    # docs 快速通道：docs/* → dev 且纯文档才跳过全量（feat 等功能分支即使纯文档 diff 也全量）。
    # 30 分钟硬超时在 reusable-ci 的 ci job 内部（caller 的 uses job 不挂 timeout-minutes）
    if: >-
      ${{ always() && !(needs.triage.result == 'success' && needs.triage.outputs.docs_only == 'true' && startsWith(github.head_ref, 'docs/') && github.base_ref == 'dev') }}
    uses: kernlab-dev/.github/.github/workflows/reusable-v10-ci.yml@main
    with:
      runner: ubuntu-latest              # GitHub 托管单腿
      # runners_matrix: '["win-ci", "pve-ci"]'   # ← 自建组合形态（二选一）
      # use_setup_dotnet: false                  # ← 自建机已预装 SDK 时关掉
      build_config: Release
      test_projects: 'tests/*/*.csproj'
      test_retries: '1'                  # 时序敏感套件重试吸收 runner 噪音
      # 卫星 UI 预构建（kernlab-dev/.github#1——Control.UI 模式卫星：dotnet 门禁前 Node 构建，内嵌资产真跑构建态）：
      # ui_project_path: src/ui
      # ui_node_version: '20'            # 缺省 20
      # ui_build_command: 'run build'    # 缺省 run build（家族栈自带 vue-tsc 类型门）

  # ── docs 质量门（组织通用段：改动文档站内链接解析）──
  # 仓专属检查（如 nav lint）另挂 job 并进 docs-merge 的 needs。
  docs-check:
    name: docs 质量门（通用）
    needs: triage
    if: >-
      ${{ needs.triage.outputs.docs_only == 'true' && startsWith(github.head_ref, 'docs/') && github.base_ref == 'dev' }}
    uses: kernlab-dev/.github/.github/workflows/reusable-v30-docs.yml@main

  # ── docs 自动合并终段：竞态复核 + squash + 删临时分支 ──
  # 前置：docs/* → dev + 纯文档 + 质量门全绿 + 非 draft。
  # DOCS_MERGE_PAT 未配置时终段显式跳过（不假绿），走人工合并。
  docs-merge:
    name: docs 自动合并（squash + 删临时分支）
    needs: [triage, docs-check]
    if: >-
      ${{ !cancelled() &&
          needs.triage.result == 'success' && needs.triage.outputs.docs_only == 'true' &&
          startsWith(github.head_ref, 'docs/') && github.base_ref == 'dev' &&
          needs.docs-check.result == 'success' &&
          github.event.pull_request.draft == false }}
    uses: kernlab-dev/.github/.github/workflows/reusable-m10-docs-merge.yml@main
    secrets:
      DOCS_MERGE_PAT: ${{ secrets.DOCS_MERGE_PAT }}
