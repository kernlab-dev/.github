name: policy-check-reusable

# 家族统一策略校验（workflow_call）：
#   PR：来源分支 ↔ 目标分支（main 只收 dev/hotfix；dev 只收短分支/main 回灌）
#   Tag：SemVer 格式、Tag↔Directory.Build.props Version、Tag↔CHANGELOG、Tag↔允许分支
# 调用方：各仓 .github/workflows/policy.yml（PR）+ release.yml 的 policy job（Tag）。
# 失败即阻断发布；不提供绕过开关。

on:
  workflow_call:
    inputs:
      version_project:
        description: '用于读取 MSBuild Version 的 csproj；空 = 跳过版本对齐检查'
        type: string
        default: ''
      changelog_file:
        description: '版本段落所在 CHANGELOG（空 = 跳过）'
        type: string
        default: 'CHANGELOG.md'
      tag_prefix:
        description: '发布线前缀（如 runtime-）；空 = 标准 v* Tag'
        type: string
        default: ''
      dotnet_version:
        description: '读取 Version 属性用的 SDK 版本'
        type: string
        default: '8.0.422'
      require_dev_for_prerelease:
        description: '预发布 Tag 必须可达 dev'
        type: boolean
        default: true
      require_main_for_ga:
        description: 'GA Tag 必须可达 main'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR branch policy
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            main)
              case "$HEAD" in
                dev|hotfix/*) ;;
                *)
                  echo "::error::PR 到 main 只允许来自 dev 或 hotfix/*（当前 $HEAD）"
                  exit 1
                  ;;
              esac
              ;;
            dev)
              case "$HEAD" in
                main|feat/*|fix/*|docs/*|chore/*|hotfix/*) ;;
                *)
                  echo "::error::PR 到 dev 只允许来自 feat/*、fix/*、docs/*、chore/*、hotfix/* 或 main 回灌（当前 $HEAD）"
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::PR 目标必须是 main 或 dev（当前 $BASE）"
              exit 1
              ;;
          esac
          echo "branch policy ok"

      - name: Setup .NET (version check)
        if: github.ref_type == 'tag' && inputs.version_project != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ inputs.dotnet_version }}'

      - name: Tag policy
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION_PROJECT: ${{ inputs.version_project }}
          CHANGELOG_FILE: ${{ inputs.changelog_file }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          REQUIRE_DEV: ${{ inputs.require_dev_for_prerelease }}
          REQUIRE_MAIN: ${{ inputs.require_main_for_ga }}
        run: |
          set -euo pipefail

          raw="$TAG"
          if [ -n "$TAG_PREFIX" ]; then
            case "$raw" in
              "$TAG_PREFIX"*) raw="${raw#"$TAG_PREFIX"}" ;;
              *) echo "::error::Tag $TAG 缺少登记前缀 $TAG_PREFIX"; exit 1 ;;
            esac
          fi
          case "$raw" in
            v*) version="${raw#v}" ;;
            *) echo "::error::Tag 必须是 vX.Y.Z[-alpha.N|-beta.N|-rc.N]（当前 $TAG）"; exit 1 ;;
          esac

          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG 不是合法 SemVer（vX.Y.Z[-alpha.N|-beta.N|-rc.N]）"
            exit 1
          fi

          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          git fetch --no-tags origin main dev

          if [ "$prerelease" = true ] && [ "$REQUIRE_DEV" = true ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
              echo "::error::预发布 Tag $TAG 必须指向 dev 可达的提交"
              exit 1
            fi
          fi
          if [ "$prerelease" = false ] && [ "$REQUIRE_MAIN" = true ]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::GA Tag $TAG 必须指向 main 可达的提交"
              exit 1
            fi
          fi

          if [ -n "$VERSION_PROJECT" ]; then
            actual=$(dotnet msbuild "$VERSION_PROJECT" -getProperty:Version -nologo | tail -n 1 | tr -d '[:space:]')
            echo "tag version=$version  props version=$actual  project=$VERSION_PROJECT"
            if [ "$actual" != "$version" ]; then
              echo "::error::Tag 版本 ($version) 与 $VERSION_PROJECT 的 Version ($actual) 不一致"
              exit 1
            fi
          fi

          if [ -n "$CHANGELOG_FILE" ]; then
            if [ ! -f "$CHANGELOG_FILE" ]; then
              echo "::error::缺少 $CHANGELOG_FILE"
              exit 1
            fi
            version_re="${version//./\\.}"
            if ! grep -Eq "^##[[:space:]]*\\[?${version_re}\\]?([[:space:]]|$)" "$CHANGELOG_FILE"; then
              echo "::error::$CHANGELOG_FILE 没有 $version 的版本段"
              exit 1
            fi
          fi

          echo "tag policy ok: $TAG (prerelease=$prerelease)"
