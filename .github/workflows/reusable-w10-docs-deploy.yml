name: w10-docs-deploy

# 家族共享文档站发布管线（workflow_call——各仓只留触发桩，逻辑单源收口于此）。
# 链路：Release 构建（取 dll 旁 XML 注释）→ docfx metadata/build → artifact(docs-site)
# → 触发 kernlab-dev/kernlab-docs 聚合 → Cloudflare Pages → docs.kernlab.dev/<product>/
# 本管线不跑测试——代码质量门在 CI（reusable-ci）/发布线（reusable-release），
# 文档质量门 = 构建成功 + 本地子路径校验清单（.github-private DOC-PUBLISH §7/§8）。
# 调用桩示例：workflow-templates/docs-deploy.yml；站点配置模板：docfx-template/。

on:
  workflow_call:
    inputs:
      product:
        description: '产品路径名（聚合仓 sites/ 目录名，如 tier）'
        type: string
        required: false
        default: ''
      project_paths:
        description: '空格分隔发布项目 csproj 路径清单（★漏一个项目其 API 参考整层缺失）'
        type: string
        required: false
        default: ''
      dotnet_version:
        description: 'SDK 版本'
        type: string
        default: '8.0.x'
    secrets:
      DOCS_SYNC_TOKEN:
        description: '对 kernlab-dev/kernlab-docs 有 actions:write 的 PAT（未配则末步显式跳过）'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # ★ 参数守卫（gate 默认继承形态：w10 对未启用文档站的仓恒成功空转）
      - name: 参数守卫（未配置文档项目则跳过）
        env:
          PRODUCT: ${{ inputs.product }}
          PROJECT_PATHS: ${{ inputs.project_paths }}
        run: |
          if [ -z "$PRODUCT" ] || [ -z "$PROJECT_PATHS" ]; then
            echo "::notice::product/project_paths 未配置——本仓未启用文档站，跳过"
            exit 0
          fi

      # ★ paths 守卫（gate 单入口形态：w10 默认继承挂 push main，本步骤保证
      #   非文档 push 秒级空转跳过，不烧 docfx；旧 stub 的触发级 paths 与本守卫双保险兼容）
      - name: paths 守卫（无文档路径显式跳过）
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "新分支/未知基线——按有文档变更处理"; exit 0
          fi
          git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null || { echo "基线不可取——按有文档变更处理"; exit 0; }
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" \
              | grep -Eq '^(docs-site/|src/.*/docs/|src/.*/COORDINATION\.md$|[^/]*\.md$|toc\.yml$|docs/)'; then
            echo "检测到文档路径——继续文档站发布"
          else
            echo "::notice::无文档路径——跳过文档站发布"
            exit 0
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '${{ inputs.dotnet_version }}'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Release build (XML doc metadata)
        # ★ 逐项目构建——docfx metadata 逐 dll 读同名 .xml；遗漏任一项目其 API 参考整层缺失
        run: |
          for proj in ${{ inputs.project_paths }}; do
            dotnet build "$proj" -c Release --nologo -v q || exit 1
          done

      - name: DocFX metadata (API reference)
        working-directory: docs-site
        run: docfx metadata docfx.json

      - name: DocFX build (site)
        working-directory: docs-site
        run: docfx build docfx.json

      - name: Upload site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: docs-site/_site
          retention-days: 7

      - name: Trigger kernlab-docs 聚合部署
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DOCS_SYNC_TOKEN 未配置，跳过聚合部署（产品仓 Settings → Secrets 配置）"
            exit 0
          fi
          # ★ REST dispatches 端点——`gh workflow run` 走 GraphQL 查默认分支，
          #   fine-grained PAT 会被拒（Resource not accessible 判例）；REST + 显式 ref 无此问题
          gh api -X POST "repos/kernlab-dev/kernlab-docs/actions/workflows/deploy.yml/dispatches" \
            -f ref=main \
            -f "inputs[product]=${{ inputs.product }}" \
            -f "inputs[repo]=${{ github.repository }}" \
            -f "inputs[run_id]=${{ github.run_id }}"
