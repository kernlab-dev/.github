name: ci-reusable

# 家族共享 CI 管线（workflow_call——各仓只留调用桩，逻辑单源收口于此）。
# Runner 双形态：
#   ① 默认 GitHub 托管机器——runner: ubuntu-latest 单腿，零基础设施；
#   ② 自建独立 CI 机器——runners_matrix 传标签组合（JSON 数组，如 '["win-ci","pve-ci"]'），
#      配 use_setup_dotnet: false（自建机预装 SDK；中国网络下 setup-dotnet 基线 runtime
#      下载随机卡死判例——自建机不走该步骤，SDK 升级归 runner 维护）。
# 扩展点：重并发组拆分、分项目特殊重试等仓专属形态，在调用桩侧加 job 补充（参照 kernlab-tier ci.yml）；
# 卫星 UI 预构建走 ui_project_path 输入（kernlab-dev/.github#1——dotnet 门禁前 Node 构建，内嵌资产真跑）。
# 调用桩示例：workflow-templates/ci.yml。

on:
  workflow_call:
    inputs:
      runner:
        description: '单腿 runner 标签（默认 GitHub 托管）'
        type: string
        default: 'ubuntu-latest'
      runners_matrix:
        description: '多腿自建组合（JSON 数组，如 ["win-ci","pve-ci"]；空 = 单腿 runner）'
        type: string
        default: ''
      dotnet_version:
        description: 'SDK 版本（精确版本——通配会被 latestMajor 滚上未知大版本）'
        type: string
        default: '8.0.x'
      use_setup_dotnet:
        description: 'GitHub 托管机保持 true；自建机已预装 SDK 时 false'
        type: boolean
        default: true
      build_config:
        description: '构建配置'
        type: string
        default: 'Release'
      solution:
        description: '解决方案/项目路径（空 = 根 sln 自动发现）'
        type: string
        default: ''
      test_projects:
        description: '测试工程 glob（空 = 只构建不测试）'
        type: string
        default: 'tests/*/*.csproj'
      test_retries:
        description: '每个测试工程失败重试次数（吸收 runner 噪音；0 = 不重试）'
        type: string
        default: '0'
      test_solution:
        description: 'true = 对整个 solution 跑一次 dotnet test（大仓 vstest 一次成型）；false = 逐 test_projects'
        type: boolean
        default: false
      test_filter:
        description: 'dotnet test 过滤表达式（空 = 不过滤）'
        type: string
        default: ''
      install_aot_toolchain:
        description: 'Linux 腿安装 NativeAOT 工具链（clang/zlib——AOT 发布探针测试依赖，cell 判例）'
        type: boolean
        default: false
      ui_project_path:
        description: '卫星 UI 工程路径（相对仓根，如 src/ui；空 = 无 UI 预构建——缺省关）'
        type: string
        default: ''
      ui_node_version:
        description: 'Node 版本（UI 预构建用）'
        type: string
        default: '20'
      ui_build_command:
        description: 'npm 构建命令（npm -C <ui_project_path> 后执行；家族栈 build 自带 vue-tsc 类型门）'
        type: string
        default: 'run build'

permissions:
  contents: read

jobs:
  ci:
    # 非 main 分支 CI 单 job 硬上限 30 分钟（BRANCHING.md §6.1）——
    # 超过 30 分钟的验证必须拆分/移出 PR（AOT/长稳/真云端点只在 main/nightly/manual）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # matrix 须为对象（维度名 → 值数组）——fromJSON 直接回数组会被 workflow 校验拒收
      matrix:
        os: ${{ fromJSON(inputs.runners_matrix != '' && inputs.runners_matrix || format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        if: inputs.use_setup_dotnet
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '${{ inputs.dotnet_version }}'

      - name: Install NativeAOT toolchain (Linux clang)
        if: inputs.install_aot_toolchain && runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Setup Node（卫星 UI 预构建）
        if: inputs.ui_project_path != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ inputs.ui_node_version }}'
          cache: npm
          cache-dependency-path: '${{ inputs.ui_project_path }}/package-lock.json'

      - name: UI 预构建（npm ci + 构建——dist 在场，卫星程序集构建期内嵌、伺服测试真跑构建态）
        if: inputs.ui_project_path != ''
        shell: bash
        run: |
          set -e
          npm -C ${{ inputs.ui_project_path }} ci
          npm -C ${{ inputs.ui_project_path }} ${{ inputs.ui_build_command }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} -c ${{ inputs.build_config }} --nologo -v q

      - name: Test（solution 一次成型 / 逐工程，均支持重试与过滤）
        if: inputs.test_solution || inputs.test_projects != ''
        shell: bash
        env:
          BUILD_CONFIG: ${{ inputs.build_config }}
          TEST_SOLUTION_MODE: ${{ inputs.test_solution }}
          TEST_SOLUTION: ${{ inputs.solution }}
          TEST_PROJECTS: ${{ inputs.test_projects }}
          TEST_FILTER: ${{ inputs.test_filter }}
          RETRIES: ${{ inputs.test_retries }}
        run: |
          set -e
          test_once() {
            if [ -n "$TEST_FILTER" ]; then
              dotnet test "$1" -c "$BUILD_CONFIG" --no-build --nologo --filter "$TEST_FILTER"
            else
              dotnet test "$1" -c "$BUILD_CONFIG" --no-build --nologo
            fi
          }
          run_with_retry() {
            target="$1"
            n=0
            until test_once "$target"; do
              n=$((n+1))
              if [ "$n" -gt "$RETRIES" ]; then
                echo "::error::$target 重试 $RETRIES 次后仍红"
                return 1
              fi
              echo "::warning::$target 第 $n 次失败，重试（吸收 runner 噪音）"
            done
          }
          if [ "$TEST_SOLUTION_MODE" = "true" ]; then
            [ -n "$TEST_SOLUTION" ] || { echo "::error::test_solution=true 需要 solution"; exit 1; }
            run_with_retry "$TEST_SOLUTION"
          else
            fail=0
            for proj in $TEST_PROJECTS; do
              [ -e "$proj" ] || continue
              run_with_retry "$proj" || fail=1
            done
            exit $fail
          fi
