name: delivery-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: 探测（不泄露值）
        env:
          K: ${{ secrets.NUGET_UNLIST_USER }}
        run: |
          if [ -z "$K" ]; then echo "NUGET_UNLIST_USER: 未送达"; else echo "NUGET_UNLIST_USER: 已送达 长度=${#K}"; fi
